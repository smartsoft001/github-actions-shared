name: Development deterministic CI report (staged)

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      mandate_id:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  DEVELOPMENT_MANUAL_ACCEPTANCE: ${{ vars.DEVELOPMENT_MANUAL_ACCEPTANCE }}
  DM_EVENT: ${{ github.event_name }}
  DM_REF: ${{ github.ref }}
  DM_SHA: ${{ github.sha }}
  DM_WORKFLOW_SHA: ${{ github.workflow_sha }}
  DM_RUN_ID: ${{ github.run_id }}
  DM_RUN_NUMBER: ${{ github.run_number }}
  DM_RUN_ATTEMPT: ${{ github.run_attempt }}
  DM_ACTOR_ID: ${{ github.actor_id }}
  DM_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
  DM_PR_NUMBER: ${{ inputs.pr_number }}
  DM_HEAD_SHA: ${{ inputs.head_sha }}
  DM_BASE_SHA: ${{ inputs.base_sha }}
  DM_MANDATE_ID: ${{ inputs.mandate_id }}
  DM_HELPER_SHA: f76cbffbd791f367b01132bd9e6d2cf316102e1a

jobs:
  prepare:
    name: manual-prepare
    if: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - name: Validate trusted execution, one-run mandate and live subject
        id: prepare
        uses: smartsoft001/github-actions-shared/.github/actions/development-manual@f76cbffbd791f367b01132bd9e6d2cf316102e1a
        with:
          mode: prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload frozen subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-manual-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/development-manual/subject.json
            ${{ runner.temp }}/development-manual/execution.json
          if-no-files-found: error
          retention-days: 7

  checks:
    name: manual-checks
    if: ${{ github.run_attempt == '1' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: smartsoft001/galena-mvno
          ref: ${{ needs.prepare.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Download frozen subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-manual-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-manual
      - name: Run fixed checks in secret-free disposable containers
        uses: smartsoft001/github-actions-shared/.github/actions/development-manual@f76cbffbd791f367b01132bd9e6d2cf316102e1a
        with:
          mode: checks
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain host receipts and bounded check logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-manual-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/development-manual/checks.json
            ${{ runner.temp }}/development-manual/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Produce report for this exact subject
        uses: smartsoft001/github-actions-shared/.github/actions/development-manual@f76cbffbd791f367b01132bd9e6d2cf316102e1a
        with:
          mode: ci-report
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish CI report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-ci-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-manual/ci-report.json
          if-no-files-found: error
          retention-days: 30
